<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Zentr CLI — your services, one terminal</title><desc id="desc">Purple Zentr wordmark and an illustrated terminal showing the CLI command groups.</desc>
