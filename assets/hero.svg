<text x="60" y="202" fill="#f3f1f7" font-size="92" font-weight="800" letter-spacing="-6">zentr<tspan fill="#a77bff">_</tspan></text>
<text x="64" y="250" fill="#f3f1f7" font-size="23">Your services. One terminal.</text>
<text x="64" y="292" fill="#9893a4" font-size="15">Explore. Encrypt. Convert. Connect.</text>
