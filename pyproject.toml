[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zentr-cli"
version = "0.4.0"
description = "A terminal companion for zentr.dev services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "cryptography>=43", "PyJWT[crypto]>=2.9,<3", "keyring>=25,<26", "prompt-toolkit>=3.0.48,<4"]

[project.scripts]
zentr = "zentr_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zentr_cli = ["vendor/drop/*.mjs", "vendor/drop/*.md"]
